name: Build Cross-Platform Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  test_and_build:
    name: Test and Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: gentk-windows-amd64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: gentk-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: gentk-linux-arm64
          - os: macos-latest
            target: universal-apple-darwin
            artifact_name: gentk-macos-universal
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'x86_64-apple-darwin,aarch64-apple-darwin' || matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Run Tests
        if: "!startsWith(matrix.target, 'aarch64-unknown') && matrix.target != 'universal-apple-darwin'"
        run: cargo test --target ${{ matrix.target }}
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            cargo build --target x86_64-apple-darwin --release
            cargo build --target aarch64-apple-darwin --release
            mkdir -p target/universal-apple-darwin/release
            lipo -create target/x86_64-apple-darwin/release/gentk target/aarch64-apple-darwin/release/gentk -output target/universal-apple-darwin/release/gentk
          else
            cargo build --target ${{ matrix.target }} --release
          fi
      - name: Prepare Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: copy target\${{ matrix.target }}\release\gentk.exe .\${{ matrix.artifact_name }}
      - name: Prepare Artifacts (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: cp target/${{ matrix.target }}/release/gentk ./${{ matrix.artifact_name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
          draft: true
