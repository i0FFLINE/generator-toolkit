[package]
name = "gentk"
version = "0.0.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
getrandom = "0.4"
uuid = { version = "1.23", features = ["v4", "v5", "v7"] }
ulid = "1.1"
cuid2 = "0.1"
tsid = "0.3"
bcrypt = "0.19"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.0"
